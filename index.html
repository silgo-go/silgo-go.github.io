  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}

let O=null;

function orderView(p){

   ${done?"":`<div class="steps">${O.pool.map(i=>`<button class="step ${O.picked.includes(i)?"picked":""}" data-i="${i}" ${O.picked.includes(i)?"disabled":""}><span class="n">·</span>${esc(c.order[i])}</button>`).join("")}</div>`}
   <div class="row">${done&&!O.checked?`<button class="btn pri" id="chk">채점</button>`:""}${O.picked.length&&!O.checked?`<button class="btn" id="undo">하나 취소</button>`:""}<button class="btn" id="re">처음부터</button></div>

/* 타이머 */
let T={left:null,run:false,id:null,total:null};
function fmt(s){const neg=s<0;s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(neg?"-":"")+h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function timerView(p){
  const c=CERTS[cur]; const mins=store.get("min_"+cur,c.min);
  if(T.left===null){T.total=mins*60;T.left=T.total}
  const pct=Math.min(100,Math.max(0,(1-T.left/T.total)*100));
  const cls=T.left<0?"over":T.left<=1800?"warn":"";
  p.innerHTML=`<h2>${c.name} 실전 타이머</h2>
   <div class="clock ${cls}" id="clk">${fmt(T.left)}</div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="row"><button class="btn pri" id="go">${T.run?"일시정지":T.left===T.total?"시작":"계속"}</button><button class="btn" id="rs">초기화</button></div>
   <label class="dur" for="mins">시험시간 <input id="mins" type="number" min="10" max="600" step="10" value="${mins}"> 분 <span class="sub">(${Math.floor(mins/60)}시간 ${mins%60}분)</span></label>
   <p class="sub">남은 시간이 30분 이하면 주황색, 시간 초과면 빨간색으로 바뀌어. 연습 끝나면 걸린 시간을 노트에 남겨봐.</p>
   <p class="note">${esc(c.note)}</p>`;
  $("#go").onclick=()=>{T.run=!T.run;if(T.run){T.id=setInterval(()=>{T.left--;const el=$("#clk");if(el&&tab==="timer"){el.textContent=fmt(T.left);el.className="clock "+(T.left<0?"over":T.left<=1800?"warn":"");const b=$(".bar i");if(b)b.style.width=Math.min(100,(1-T.left/T.total)*100)+"%"}},1000)}else clearInterval(T.id);render()};
  $("#rs").onclick=()=>{clearInterval(T.id);T={left:null,run:false,id:null,total:null};render()};
  $("#mins").onchange=e=>{const v=Math.max(10,Math.min(600,+e.target.value||c.min));store.set("min_"+cur,v);if(!T.run){T.left=null}render()};
}

/* ===== 전자 납땜 시뮬레이터 ===== */
const PARTS={
  R:{name:"저항 330Ω",low:true},
  D:{name:"다이오드 1N4001",low:true,polar:true},
  C:{name:"전해 콘덴서 100µF",polar:true},
  LED:{name:"LED (빨강)",polar:true},
  SW:{name:"택트 스위치"}
};
const FP=[
  {id:"J1",fixed:true,pads:[[40,90],[40,425]]},
  {id:"D1",want:"D",pads:[[100,90],[180,90]],lab:[140,62,"middle"]},
  {id:"C1",want:"C",pads:[[180,180],[180,280]],lab:[146,234,"end"]},
  {id:"SW1",want:"SW",pads:[[300,125],[300,185]],lab:[266,160,"end"]},
  {id:"R1",want:"R",pads:[[300,220],[300,290]],lab:[266,260,"end"]},
  {id:"LED1",want:"LED",pads:[[300,330],[300,385]],lab:[266,362,"end"]}
];
const TRACES=[[[40,90],[100,90]],[[180,90],[300,90],[300,125]],[[180,90],[180,180]],[[300,185],[300,220]],[[300,290],[300,330]],[[300,385],[300,425],[40,425]],[[180,280],[180,425]]];
const REV={
  D:"D1 다이오드가 거꾸로 꽂혔어. 다이오드는 한 방향으로만 전류를 흘려서, 회로 전체에 전기가 안 가.",
  C:"C1 전해 콘덴서가 거꾸로 꽂혔어. 실제로는 열나고 부풀거나 터질 수 있어서 바로 전원을 꺼야 해.",
  LED:"LED1이 거꾸로 꽂혔어. LED도 다이오드라서 반대로 꽂으면 불이 안 켜져."
};
const STAGES=[["place","① 꽂기"],["solder","② 납땜"],["cut","③ 리드"],["test","④ 전원"]];
const T_COLD=0.7,T_GOOD=1.6,T_MAX=2.4;
let S=null,FL=null;
function newSim(){S={placed:{},joints:{},cut:{},sel:null,selFlip:false,orderTip:false,stage:"place",result:null,pressing:false,flick:true,schem:false,
  msg:["부품을 고르고, 기판에서 같은 이름이 인쇄된 자리를 눌러 꽂아.",""]}}
const padsOf=f=>f.pads.map((p,i)=>({id:f.id+":"+i,f,x:p[0],y:p[1]}));
const activePads=()=>FP.filter(f=>f.fixed||S.placed[f.id]).flatMap(padsOf);
function say(t,k){S.msg=[t,k||""];const m=$("#msg");if(m){m.textContent=t;m.className="simmsg "+(k||"")}}

function bbox(f){const xs=f.pads.map(p=>p[0]),ys=f.pads.map(p=>p[1]),v=xs[0]===xs[1],ax=v?24:12,ay=v?12:24;
  return{x:Math.min(...xs)-ax,y:Math.min(...ys)-ay,w:Math.max(...xs)-Math.min(...xs)+2*ax,h:Math.max(...ys)-Math.min(...ys)+2*ay}}

function partSVG(f,pl,glow){
  const[a,b]=f.pads,cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,vert=a[0]===b[0],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const s=pl.flip?1:-1; /* +쪽(애노드) 로컬 x 부호 */
  let g=`<line x1="${-len/2}" y1="0" x2="${len/2}" y2="0" stroke="#b9bec2" stroke-width="2.2"/>`;
  if(pl.part==="R"){const L=len-30;g+=`<rect x="${-L/2}" y="-7" width="${L}" height="14" rx="6" fill="#d8bf8c"/>`;
    [["#e67e22",-L/2+9],["#e67e22",-L/2+16],["#7b4a1e",-L/2+23],["#c9a23a",L/2-10]].forEach(([c,x])=>g+=`<rect x="${x}" y="-7" width="4" height="14" fill="${c}"/>`)}
  if(pl.part==="D"){const L=len-44;g+=`<rect x="${-L/2}" y="-6.5" width="${L}" height="13" rx="2" fill="#222"/><rect x="${-s>0?L/2-9:-L/2+5}" y="-6.5" width="4" height="13" fill="#c8ccd0"/>`}
  if(pl.part==="C"){const id="cc"+f.id;g+=`<clipPath id="${id}"><circle r="27"/></clipPath><circle r="27" fill="#24508f"/>
    <rect x="${-s>0?9:-27}" y="-27" width="18" height="54" fill="#b9c7de" clip-path="url(#${id})"/>
    <text x="${-s>0?18:-18}" y="5" font-size="14" font-weight="700" text-anchor="middle" fill="#24508f" transform="rotate(${vert?-90:0} ${-s>0?18:-18} 0)">−</text>
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#9fb3d6" stroke-width="1.5"/>`}
  if(pl.part==="LED"){if(glow)g+=`<circle r="34" fill="#ff4d4d" opacity=".85" filter="url(#glow)"/>`;
    g+=`<circle r="17" fill="${glow?"#ff7b7b":"#b71c1c"}" stroke="${glow?"#ffd0d0":"#e57373"}" stroke-width="2"/>
    <rect x="${-s>0?13:-19}" y="-19" width="6" height="38" fill="#1d5a3a"/><circle r="6" fill="${glow?"#fff3f3":"#d84343"}" opacity=".7"/>`}
  if(pl.part==="SW"){g+=`<rect x="-18" y="-18" width="36" height="36" rx="4" fill="#2b2b2b"/><circle r="10" fill="${S.pressing&&S.stage==="test"?"#4a4a4a":"#7d7d7d"}"/>`}
  return `<g transform="translate(${cx} ${cy}) rotate(${vert?90:0})">${g}</g>`;
}

function jointSVG(p){
  const st=S.joints[p.id];let h="";
  if(st==="good")h+=`<circle cx="${p.x}" cy="${p.y}" r="8.5" fill="url(#sol)"/><circle cx="${p.x-2.5}" cy="${p.y-2.5}" r="2" fill="#fff" opacity=".9"/>`;
  if(st==="cold")h+=`<path d="M${p.x-9} ${p.y-2} l3 -6 l5 1 l4 -3 l5 4 l1 6 l-3 5 l-6 2 l-6 -1 l-3 -4z" fill="#8b918d" stroke="#5f6561" stroke-width="1"/>`;
  if(st==="over")h+=`<circle cx="${p.x}" cy="${p.y}" r="14" fill="url(#sol)"/><circle cx="${p.x-4}" cy="${p.y-4}" r="2.5" fill="#fff" opacity=".8"/>`;
  if(!p.f.fixed&&!S.cut[p.id])h+=`<line x1="${p.x}" y1="${p.y}" x2="${p.x+9}" y2="${p.y-12}" stroke="#d3d8dc" stroke-width="2.4" stroke-linecap="round"/>`;
  return h;
}

function drawBoard(){
  const r=S.result,glow=r&&r.works&&S.pressing&&(!r.flicker||S.flick);
  let h=`<defs><radialGradient id="sol" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9dde0"/><stop offset="1" stop-color="#8d959b"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <rect x="4" y="4" width="352" height="452" rx="14" fill="#1d5a3a"/>`;
  TRACES.forEach(t=>h+=`<polyline points="${t.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#2c7a50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`);
  /* 실크 인쇄 */
  h+=`<g fill="#e6efe8" font-family="JetBrains Mono,monospace" font-size="13" font-weight="700">
    <rect x="22" y="72" width="36" height="36" rx="4" fill="#4b545b"/><rect x="22" y="407" width="36" height="36" rx="4" fill="#4b545b"/>
    <text x="40" y="60" text-anchor="middle">+5V</text><text x="40" y="453" text-anchor="middle">GND</text><text x="72" y="256" font-size="11" opacity=".75">J1 전원 단자</text>`;
  FP.filter(f=>!f.fixed).forEach(f=>{const b=bbox(f);
    h+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="none" stroke="#e6efe8" stroke-width="1.2" stroke-dasharray="5 4" opacity=".8"/>
    <text x="${f.lab[0]}" y="${f.lab[1]}" text-anchor="${f.lab[2]}">${f.id}</text>`});
  h+=`<rect x="152" y="80" width="4" height="20"/>
    <text x="202" y="172" font-size="16">+</text><text x="318" y="328" font-size="16">+</text></g>`;
  /* 패드 */
  FP.flatMap(padsOf).forEach(p=>h+=`<circle cx="${p.x}" cy="${p.y}" r="9" fill="#c98b3a"/><circle cx="${p.x}" cy="${p.y}" r="3" fill="#0e2a1b"/>`);
  /* 부품 */
  FP.filter(f=>S.placed[f.id]).forEach(f=>h+=partSVG(f,S.placed[f.id],f.id==="LED1"&&glow));
  /* 납땜 */
  activePads().forEach(p=>h+=jointSVG(p));
  h+=`<g id="heatg" visibility="hidden"><circle r="18" fill="none" stroke="#ffb74d" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 120" id="heatc"/></g>`;
  /* 터치 영역 */
  if(S.stage==="place")FP.filter(f=>!f.fixed).forEach(f=>{const b=bbox(f);h+=`<rect data-fp="${f.id}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent"/>`});
  if(S.stage==="solder"||S.stage==="cut")FP.flatMap(padsOf).forEach(p=>h+=`<circle data-pad="${p.id}" cx="${p.x}" cy="${p.y}" r="16" fill="transparent"/>`);
  if(S.stage==="test"&&S.placed.SW1){const b=bbox(FP[3]);h+=`<rect data-sw="1" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent"/>`}
  $("#board").innerHTML=h;
}

function counts(){
  const placed=FP.filter(f=>!f.fixed&&S.placed[f.id]).length;
  const ap=activePads(),sold=ap.filter(p=>S.joints[p.id]).length;
  const lp=ap.filter(p=>!p.f.fixed),cut=lp.filter(p=>S.cut[p.id]).length;
  return{place:`${placed}/5`,solder:`${sold}/${ap.length}`,cut:`${cut}/${lp.length}`,test:S.result?(S.result.works?"OK":"NG"):"-"};
}

function drawCtrl(){
  const c=counts();
  $("#stages").innerHTML=STAGES.map(([k,l])=>`<button class="stg" data-st="${k}" aria-pressed="${S.stage===k}">${l}<small>${c[k]}</small></button>`).join("");
  document.querySelectorAll(".stg").forEach(b=>b.onclick=()=>{S.stage=b.dataset.st;S.pressing=false;
    if(S.stage==="test")S.result=null;
    say({place:"부품을 고르고, 같은 이름이 인쇄된 자리를 눌러 꽂아.",solder:"패드를 꾹 누르고 있다가 초록 구간에서 손을 떼. 인두로 패드와 리드를 같이 데우는 느낌이야.",cut:"납땜한 곳을 눌러서 남은 리드선을 잘라.",test:"전원을 넣기 전에 빠진 곳이 없는지 한 번 더 봐."}[S.stage]);
    drawBoard();drawCtrl()});
  const k=$("#ctrl");let h="";
  if(S.stage==="place"){
    const left=Object.keys(PARTS).filter(p=>!Object.values(S.placed).some(x=>x.part===p));
    h+=left.length?`<div class="tray">${left.map(p=>`<button class="chip" data-p="${p}" aria-pressed="${S.sel===p}">${PARTS[p].name}</button>`).join("")}</div>`:`<p class="sub">부품을 다 꽂았어. ② 납땜으로 넘어가.</p>`;
    if(S.sel&&PARTS[S.sel].polar)h+=`<div class="row"><button class="btn" id="flip">방향 뒤집기</button><span class="sub" style="align-self:center">지금: ${S.selFlip?"<b>뒤집힌 방향</b>":"기본 방향"}</span></div>`;
    h+=`<p class="sub">꽂힌 부품을 누르면 다시 빠져. 극성 있는 부품은 실크 인쇄의 +, 띠 표시를 잘 봐.</p>`;
  }
  if(S.stage==="solder")h+=`<div class="gauge"><span class="z c"></span><span class="z g"></span><span class="z o"></span><i id="gfill"></i></div><div class="glab"><span>냉납</span><span>양호</span><span>납 과다</span></div>
    <p class="sub">이미 납땜한 곳을 다시 누르면 고쳐 할 수 있어. 실제로는 납 흡입기로 납을 빼고 다시 해.</p>`;
  if(S.stage==="cut")h+=`<p class="sub">리드는 납땜 위쪽 1~2mm 정도 남기고 잘라. 너무 바짝 자르면 납땜에 금이 갈 수 있어.</p>`;
  if(S.stage==="test"){
    if(!S.result)h+=`<button class="btn pri press" id="pw">전원 넣기 (DC 5V)</button>`;
    else{const r=S.result;
      h+=`<p class="verdict ${r.works?"ok":"no"}">${r.works?(r.flicker?"동작은 하는데 불안정해":"동작 OK!"):"동작 안 함"}</p>`;
      if(r.works)h+=`<button class="btn pri press" id="sw">SW1 누르고 있기</button>`;
      if(r.fatal.length||r.warn.length)h+=`<ul class="res">${r.fatal.map(t=>`<li class="f">${esc(t)}</li>`).join("")}${r.warn.map(t=>`<li class="w">${esc(t)}</li>`).join("")}</ul>`;
      else h+=`<p class="sub">감점 요소 없음. 깔끔해!</p>`;
      h+=`<div class="row"><button class="btn" id="off">전원 끄기</button></div>`;
    }
  }
  k.innerHTML=h;
  k.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.sel=S.sel===b.dataset.p?null:b.dataset.p;S.selFlip=false;
    if(S.sel)say(`${PARTS[S.sel].name} 들었어. 꽂을 자리를 눌러.`);drawCtrl()});
  const fl=$("#flip");if(fl)fl.onclick=()=>{S.selFlip=!S.selFlip;drawCtrl()};
  const pw=$("#pw");if(pw)pw.onclick=()=>{S.result=evaluate();logFails();drawBoard();drawCtrl();
    say(S.result.works?"전원 들어갔어. SW1을 누르고 있으면 LED가 켜져야 해.":"문제가 있어. 아래 목록을 보고 고쳐봐.",S.result.works?"good":"bad")};
  const off=$("#off");if(off)off.onclick=()=>{S.result=null;S.pressing=false;drawBoard();drawCtrl();say("전원 껐어. 고칠 단계로 돌아가서 수정해.")};
  const sw=$("#sw");if(sw){const dn=e=>{e.preventDefault();press(true)},up=()=>press(false);
    sw.addEventListener("pointerdown",dn);["pointerup","pointerleave","pointercancel"].forEach(ev=>sw.addEventListener(ev,up))}
}

function press(on){
  if(S.pressing===on)return;S.pressing=on;clearInterval(FL);
  if(on&&S.result&&S.result.flicker)FL=setInterval(()=>{S.flick=Math.random()>.45;drawBoard()},110);
  S.flick=true;drawBoard();
}

function evaluate(){
  const fatal=[],warn=[];
  FP.filter(f=>!f.fixed).forEach(f=>{const pl=S.placed[f.id];
    if(!pl){fatal.push(`${f.id} 자리가 비어 있어.`);return}
    if(pl.part!==f.want){fatal.push(`${f.id} 자리에 ${PARTS[pl.part].name}이(가) 꽂혔어. 여기는 ${PARTS[f.want].name} 자리야.`);return}
    if(PARTS[pl.part].polar&&pl.flip)fatal.push(REV[pl.part]);
  });
  const ap=activePads(),none=ap.filter(p=>!S.joints[p.id]),cold=ap.filter(p=>S.joints[p.id]==="cold"),over=ap.filter(p=>S.joints[p.id]==="over"),uncut=ap.filter(p=>!p.f.fixed&&!S.cut[p.id]);
  const names=a=>[...new Set(a.map(p=>p.f.id))].join(", ");
  if(none.length)fatal.push(`납땜 안 한 곳 ${none.length}개 (${names(none)}). 그 부분은 전기가 안 통해.`);
  if(cold.length)warn.push(`냉납 ${cold.length}개 (${names(cold)}). 접촉이 불안정해서 LED가 깜빡이거나 꺼질 수 있어.`);
  if(over.length)warn.push(`납 과다 ${over.length}개 (${names(over)}). 옆 패턴이랑 붙으면(브릿지) 단락 위험이 있어.`);
  if(uncut.length)warn.push(`리드 안 자른 곳 ${uncut.length}개. 긴 리드끼리 닿으면 단락될 수 있고 감점 요소야.`);
  if(S.orderTip)warn.push("키 큰 부품을 먼저 꽂았어. 낮은 부품(저항·다이오드)부터 꽂아야 기판을 뒤집어 납땜할 때 부품이 안 빠져.");
  return{fatal,warn,works:!fatal.length,flicker:cold.some(p=>p.f.id!=="C1")};
}
function logFails(){const r=S.result;if(!r||(!r.fatal.length&&!r.warn.length))return;
  addNote("[납땜 실습] "+(r.works?"동작은 했지만":"동작 안 함")+"\n- "+[...r.fatal,...r.warn].join("\n- "))}

function onBoard(e){
  const t=e.target;
  if(S.stage==="place"&&t.dataset.fp){const id=t.dataset.fp;
    if(S.placed[id]){const pl=S.placed[id];delete S.placed[id];padsOf(FP.find(f=>f.id===id)).forEach(p=>{delete S.joints[p.id];delete S.cut[p.id]});
      S.sel=pl.part;S.selFlip=pl.flip;say(`${id}에서 ${PARTS[pl.part].name}을(를) 뺐어. 다시 꽂을 자리를 눌러.`)}
    else if(S.sel){S.placed[id]={part:S.sel,flip:S.selFlip};
      if(!PARTS[S.sel].low&&Object.keys(PARTS).some(p=>PARTS[p].low&&!Object.values(S.placed).some(x=>x.part===p)))S.orderTip=true;
      say(`${id} 자리에 ${PARTS[S.sel].name} 꽂았어.`);S.sel=null;S.selFlip=false}
    else say("먼저 아래에서 부품을 골라.","warn");
    drawBoard();drawCtrl();return}
  if(S.stage==="solder"&&t.dataset.pad){
    const p=activePads().find(x=>x.id===t.dataset.pad);if(!p){say("여긴 아직 부품이 없어. 부품부터 꽂아.","warn");return}
    e.preventDefault();try{t.releasePointerCapture&&t.releasePointerCapture(e.pointerId)}catch(_){}
    startHeat(p);return}
  if(S.stage==="cut"&&t.dataset.pad){
    const p=activePads().find(x=>x.id===t.dataset.pad);
    if(!p||p.f.fixed){say("단자대는 리드가 없어.","warn");return}
    if(!S.joints[p.id]){say("납땜부터 하고 잘라야 해. 먼저 자르면 부품이 빠질 수 있어.","warn");return}
    S.cut[p.id]=true;say(`${p.f.id} 리드 잘랐어.`);drawBoard();drawCtrl();return}
  if(S.stage==="test"&&t.dataset.sw&&S.result&&S.result.works){e.preventDefault();press(true)}
}
let H=null;
function startHeat(p){
  H={p,t0:performance.now(),redo:!!S.joints[p.id]};
  const g=$("#heatg");g.setAttribute("transform",`translate(${p.x} ${p.y}) rotate(-90)`);g.setAttribute("visibility","visible");
  say(H.redo?"다시 데우는 중...":"데우는 중... 초록 구간에서 떼!");
  const tick=()=>{if(!H)return;const s=(performance.now()-H.t0)/1000,f=Math.min(1,s/T_MAX);
    const c=$("#heatc");if(c){c.setAttribute("stroke-dasharray",`${f*113} 120`);c.setAttribute("stroke",s<T_COLD?"#9aa29e":s<=T_GOOD?"#6fcf8f":"#ef7b6e")}
    const gf=$("#gfill");if(gf)gf.style.width=f*100+"%";
    if(s>=T_MAX)endHeat();else requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function endHeat(){
  if(!H)return;const s=(performance.now()-H.t0)/1000,p=H.p,redo=H.redo;H=null;
  const st=s<T_COLD?"cold":s<=T_GOOD?"good":"over";S.joints[p.id]=st;S.cut[p.id]=false;
  const pre=redo?"다시 납땜: ":"";
  if(st==="cold")say(pre+"냉납! 너무 빨리 뗐어. 납이 덜 퍼져서 회색으로 거칠어. 다시 눌러서 고쳐.","bad");
  if(st==="good")say(pre+"좋아! 매끈하고 반짝이는 산 모양이야.","good");
  if(st==="over")say(pre+"너무 오래 댔어. 납이 뭉쳐서 옆 패턴과 붙을 위험이 있어. 다시 해봐.","warn");
  const gf=$("#gfill");if(gf)gf.style.width="0";
  drawBoard();drawCtrl();
}

const BANDS={27000:["#d32f2f","#8e24aa","#ef6c00","#c9a23a"],300:["#ef6c00","#111111","#6d4c41","#c9a23a"],1000:["#6d4c41","#111111","#d32f2f","#c9a23a"]};

};

function newK(){K={parts:{},wires:[],cuts:[],mode:"part",view:"front",sel:null,selRot:0,wStart:null,wColor:"black",erase:false,
  res:null,up:true,cnt:0,latch:0,showVal:false,zoom:18,orderTip:false,msg:["부품을 고르고 앞면 기판의 구멍을 눌러 꽂아. 오른쪽 패턴도는 앞면용(좌우 반전)이야.",""]}}

/* 핀 위치: 앞면 기준 (x=열 인덱스 0..61 → 물리 열 번호 c=x+1), 회전 rot 0..3 */
function baseOff(P){
  if(P.kind==="ic"||P.kind==="fnd"){const h=P.n/2,o=[];for(let k=1;k<=P.n;k++)o.push(k<=h?[k-1,P.gap]:[P.n-k,0]);return o}
  if(P.kind==="sw")return[[0,0],[1,0],[2,0]];
  return[[0,0],[P.span,0]];
}
function rotOff(o,rot){for(let r=0;r<rot;r++)o=o.map(([x,y])=>[-y,x]);const mx=Math.min(...o.map(p=>p[0])),my=Math.min(...o.map(p=>p[1]));return o.map(([x,y])=>[x-mx,y-my])}
function pinsOf(key,pl){const o=rotOff(baseOff(K1P[key]),pl.rot);return o.map(([x,y])=>[pl.a[0]+x,pl.a[1]+y])} /* [c, j] */
function fits(key,a,rot,skip){
  const o=rotOff(baseOff(K1P[key]),rot).map(([x,y])=>[a[0]+x,a[1]+y]);
  if(o.some(([c,j])=>c<1||c>GC||j<1||j>GR-2))return"기판 밖으로 나가. 다른 위치를 골라.";
  const used=new Set();Object.entries(K.parts).forEach(([k,pl])=>{if(k===skip)return;pinsOf(k,pl).forEach(([c,j])=>used.add(hid(c,j)))});
  if(o.some(([c,j])=>used.has(hid(c,j))))return"다른 부품 다리랑 같은 구멍이야.";
  return"";
}
const vx=c=>K.view==="back"?GC-c:c-1; /* 뒷면은 실제처럼 좌우 반전 */
const ux=x=>K.view==="back"?GC-x:x+1;

/* ---------- 그리기 ---------- */
const M=1.6; /* 여백(라벨) */
function boardStatic(){
  let h=`<rect x="0" y="0" width="${GC+M+0.8}" height="${GR+M+0.8}" fill="#123524"/>
   <rect x="${M-0.6}" y="${M-0.6}" width="${GC+0.2}" height="${GR+0.2}" rx="0.4" fill="${K.view==="back"?"#c9b48a":"#1e5a3e"}"/>`;
  const ring=K.view==="back"?"#b07a3a":"#3e8a62",hole=K.view==="back"?"#4a3a22":"#0d2619";
  h+=`<defs><pattern id="hp${K.view}" x="${M-0.5}" y="${M-0.5}" width="1" height="1" patternUnits="userSpaceOnUse"><circle cx="0.5" cy="0.5" r="0.3" fill="${ring}"/><circle cx="0.5" cy="0.5" r="0.11" fill="${hole}"/></pattern></defs>
   <rect x="${M-0.5}" y="${M-0.5}" width="${GC}" height="${GR}" fill="url(#hp${K.view})"/>`;
  for(let x=0;x<GC;x++)if((ux(x))%2===0||ux(x)===1)h+=`<text x="${M+x}" y="${M-0.85}" font-size="0.5" text-anchor="middle" fill="#9fc9b0" font-family="JetBrains Mono,monospace">${ux(x)}</text>`;

/* ---------- 실행 엔진 ---------- */
function plVal(s,ad){const k=ad[0],n=+ad.slice(1);
  if(k==="X")return!!s.X[n];if(k==="Y")return!!s.Y[n];if(k==="M")return!!s.M[n];
  if(k==="T")return!!(s.T[n]&&s.T[n].on);if(k==="C")return!!(s.C[n]&&s.C[n].on);return false}
function plCv(s,c){const v=plVal(s,c.ad);return c.t==="a"?v:!v}
function plCond(s,r){return r.cells.every(g=>g.rows.some(row=>row.every(c=>plCv(s,c))))}
function plScan(s,rungs,dt){
  /* 입력 갱신: 센서는 실린더 위치로 */
  if(s.k1)plK1In(s);else{s.X[3]=s.posA<=0.02?1:0;s.X[4]=s.posA>=0.98?1:0;s.X[5]=s.posB<=0.02?1:0;s.X[6]=s.posB>=0.98?1:0}
  rungs.forEach((r,i)=>{if(!r.out||!r.out.ad)return;const cond=plCond(s,r),o=r.out,k=o.ad[0],n=+o.ad.slice(1);
    if(o.op==="OUT"){
      if(k==="Y")s.Y[n]=cond?1:0;else if(k==="M")s.M[n]=cond?1:0;
      else if(k==="T"){const t=s.T[n]||(s.T[n]={acc:0,on:false});if(cond){t.acc+=dt;t.on=t.acc>=(o.k||0)*100}else{t.acc=0;t.on=false}}
      else if(k==="C"){const c=s.C[n]||(s.C[n]={cnt:0,on:false,prev:false});if(cond&&!c.prev){c.cnt++;}c.prev=cond;c.on=c.cnt>=(o.k||1)}}
    else if(o.op==="SET"&&cond){if(k==="Y")s.Y[n]=1;if(k==="M")s.M[n]=1}
    else if(o.op==="RST"&&cond){if(k==="Y")s.Y[n]=0;if(k==="M")s.M[n]=0;if(k==="T")s.T[n]={acc:0,on:false};if(k==="C")s.C[n]={cnt:0,on:false,prev:false}}});
  if(s.k1){plK1Phys(s,dt);return}
  /* 실린더: 편솔, 0.8초에 끝까지 */
  const sp=dt/800,pa=s.posA,pb=s.posB;
  s.posA=s.Y[0]?Math.min(1,pa+sp):Math.max(0,pa-sp);s.posB=s.Y[1]?Math.min(1,pb+sp):Math.max(0,pb-sp);
  if(pa<0.98&&s.posA>=0.98)s.seq+="A+";if(pa>0.02&&s.posA<=0.02)s.seq+="A-";
  if(pb<0.98&&s.posB>=0.98)s.seq+="B+";if(pb>0.02&&s.posB<=0.02)s.seq+="B-";
}
function plWarn(rungs){const w=[],seen={};
  rungs.forEach((r,i)=>{if(!r.out||!r.out.ad)return;if(r.out.op==="OUT"&&/^[YM]/.test(r.out.ad)){if(seen[r.out.ad]!==undefined)w.push(`${r.out.ad}를 OUT으로 두 번 썼어(이중 코일). 아래쪽 렁만 적용돼.`);seen[r.out.ad]=i}
    if(r.out.op==="OUT"&&/^[TC]/.test(r.out.ad)&&!(r.out.k>0))w.push(`${r.out.ad}에 K값(설정값)이 없어.`);
    if(r.out.ad[0]==="X")w.push("X는 입력이라 코일로 쓸 수 없어.")});return w}
function plGrade(les){
  const s=plNew(),log=[];let ok=true,fail="";
  for(const st of les.test){
    if(st.x)Object.entries(st.x).forEach(([a,v])=>s.X[+a.slice(1)]=v);
    for(let t=0;t<(st.w||0);t+=PL_SCAN)plScan(s,PL.rungs,PL_SCAN);
    if(st.e)for(const[a,v]of Object.entries(st.e)){if((plVal(s,a)?1:0)!==v){ok=false;fail=`${a}가 ${v?"켜져":"꺼져"} 있어야 하는데 ${v?"꺼져":"켜져"} 있어.`;break}}
    if(ok&&st.seq&&s.seq!==st.seq){ok=false;fail=`실린더 동작 순서가 ${st.seq.replace(/([AB][+-])/g," $1").trim()} 이어야 하는데 ${s.seq?s.seq.replace(/([AB][+-])/g," $1").trim():"움직이지 않았"}${s.seq?"였":""}어.`}
    if(!ok)break}
  return{ok,fail};
}

/* ---------- 니모닉(명령어) 변환 ---------- */
function plMnem(rungs){const L=[];
  const ld=(c,first)=>(first?(c.t==="a"?"LD ":"LDI "):(c.t==="a"?"AND ":"ANI "))+c.ad;
  const block=g=>{const o=[];g.rows.forEach((row,ri)=>{if(!row.length)return;
      if(ri===0){row.forEach((c,ci)=>o.push(ld(c,ci===0)))}
      else if(row.length===1)o.push((row[0].t==="a"?"OR ":"ORI ")+row[0].ad);
      else{row.forEach((c,ci)=>o.push(ld(c,ci===0)));o.push("ORB")}});return o};
  rungs.forEach(r=>{if(!r.out||!r.out.ad)return;
    if(!r.cells.length)L.push("LD SM400  ; 항상 ON");
    r.cells.forEach((g,gi)=>{const simple=g.rows.length===1&&g.rows[0].length>=1;
      if(gi===0)L.push(...block(g));
      else if(simple)g.rows[0].forEach(c=>L.push(ld(c,false)));
      else{L.push(...block(g));L.push("ANB")}});
    const o=r.out;L.push(o.op==="OUT"&&/^[TC]/.test(o.ad)?`OUT ${o.ad} K${o.k||0}`:`${o.op} ${o.ad}`)});
  L.push("END");return L}

/* 동작 기록: A1 공급(밸브 방향) A2 가공 A3 송출 A4 배출 A5 드릴 A6 컨베이어 / 램프 R·YL·G / 센서 */

  <section><h3>② 주소 읽는 법 (미쓰비시)</h3>
   <p>PLC는 모든 걸 <b>글자+번호</b>로 불러. 이것만 알면 반은 끝이야.</p>

   <tr><td><code>C</code></td><td>카운터. 몇 번 들어왔는지 셈</td><td>5번 왕복하면 멈춤</td></tr></table>
   <p>이 앱 기계에 연결된 번호야:</p>
   <table><tr><th>입력 X</th><th>출력 Y</th></tr><tr><td>${Object.entries(PL_IN).map(([a,t])=>`<code>${a}</code> ${t}`).join("<br>")}</td><td>${Object.entries(PL_OUT).map(([a,t])=>`<code>${a}</code> ${t}`).join("<br>")}</td></tr></table></section>

  <section><h3>③ 래더 읽는 법</h3>

   <p>읽는 법: "X0가 켜지면 Y4를 켜라" → 시작 버튼 누르는 동안 초록 램프가 켜져.</p>
   <table><tr><th>기호</th><th>이름</th><th>뜻</th></tr>
   <tr><td><code>─┤ ├─</code></td><td>a접점</td><td>평소엔 <b>끊겨</b> 있다가, 신호가 오면 <b>붙어</b>. "누르면 통함"</td></tr>
   <tr><td><code>─┤/├─</code></td><td>b접점</td><td>평소엔 <b>붙어</b> 있다가, 신호가 오면 <b>끊겨</b>. "누르면 끊김" (정지 버튼에 씀)</td></tr>
   <tr><td><code>─( )─</code></td><td>코일(출력)</td><td>전기가 오면 켜짐. OUT/SET/RST 중 골라</td></tr></table>
   <p><b>직렬(옆으로 이어 붙이기) = 그리고(AND)</b>: 문 두 개를 둘 다 열어야 지나갈 수 있어.</p>

  <section><h3>④ 이 앱에서 래더 만드는 법</h3>
   <ol><li>위에서 <b>레슨</b>을 누르고 번호를 골라. 목표를 읽어.</li>
   <li>래더 칸의 <b>⊕</b>를 누르면 접점을 넣는 창이 떠. <b>a접점/b접점</b>을 고르고 <b>주소(X0 같은 것)</b>를 고른 뒤 <b>넣기</b>.</li>
   <li>오른쪽 끝 <b>점선 동그라미 "출력"</b>을 눌러. 보통은 <b>OUT</b>, 주소(Y4 같은 것)를 고르고 <b>정하기</b>.</li>
   <li>병렬이 필요하면 이미 넣은 접점을 눌러서 <b>"아래에 병렬 추가"</b>.</li>
   <li>줄(렁)이 더 필요하면 <b>+ 렁 추가</b>. 위에서부터 차례로 실행돼.</li>
   <li><b>▶ RUN</b>을 누르고 기계 왼쪽 <b>조작반 버튼</b>을 눌러봐. 래더에서 <b style="color:#2ecc71">초록색</b>이 된 곳이 전기가 흐르는 곳이야.</li>
   <li>잘 되면 <b>채점하기</b>. 막히면 <b>▶ 정답 시연</b>으로 기계가 어떻게 움직여야 하는지 먼저 보고 따라 만들어.</li></ol></section>

  <section><h3>⑤ 기계 구경하기</h3>
   <p><b>조작반</b>: 램프 3개(Y4·Y5·Y6), 부저(Y7), 버튼 3개(PB1~3 = X0~X2). 버튼은 <b>누르는 동안만</b> 켜져. 손 떼면 꺼져!</p>
   <p><b>A 실린더</b>: 공작물을 오른쪽으로 밀어. <b>B 실린더</b>: 위에서 내려와 공작물을 찍어(도장 쾅).</p>
   <p><b>밸브(Y0, Y1)</b>: 편솔 밸브라서 Y가 켜져 있는 동안 공기가 들어가(파랗게) 전진하고, 꺼지면 스프링으로 후진해.</p>
   <p><b>센서(노란 불)</b>: 실린더에 붙은 리드 스위치야. A가 뒤에 있으면 X3, 끝까지 나가면 X4가 켜져. B는 X5(위), X6(아래).</p>
   <p>시험에선 동작을 <b>A+ (A 전진), A− (A 후진)</b>처럼 써. "A+ B+ A− B−"는 A 나가고 → B 나가고 → A 들어오고 → B 들어오기야.</p></section>

  <section><h3>⑥ 자주 하는 실수</h3>
   <ol><li><b>RUN을 안 눌렀어</b>: STOP 상태에선 아무것도 안 움직여.</li>
   <li><b>버튼에서 손 떼니 꺼져</b>: 정상이야! 계속 켜두려면 자기유지(레슨 3)가 필요해.</li>
   <li><b>같은 Y를 OUT으로 두 번</b>: 이중 코일이라 아래 것만 적용돼. 한 번만 써.</li>
   <li><b>타이머에 K값 안 넣음</b>: T0를 쓰면 K값(몇 초)을 꼭 정해.</li>
   <li><b>래더 수정이 안 돼</b>: RUN 중엔 편집이 잠겨. STOP 누르고 고쳐.</li></ol></section>
  <button class="btn pri" id="plgo">1번 레슨 시작하기 →</button></div>`};
