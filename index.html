<style>
/* Layout: 한 손 조작용 단일 컬럼. 자격증마다 KEC 전선 색을 표식으로 사용 */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1d2220; --fg:#e7ebe8; --muted:#9aa59f; --line:#323a36;
  --accent:#6fbf94; --accent-fg:#0f1411; --ok:#6fcf8f; --bad:#ef7b6e; --warn:#e2b25a;
  --w-brown:#c28a55; --w-black:#c9cec9; --w-gray:#9ea7a2; --w-blue:#7aa4ea; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#6fbf94; --accent-fg:#0f1411; --ok:#6fcf8f; --bad:#ef7b6e; --warn:#e2b25a;
  --w-brown:#c28a55; --w-black:#c9cec9; --w-gray:#9ea7a2; --w-blue:#7aa4ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:4px 0 0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}

.stg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.stg[aria-pressed="true"] small{color:var(--accent-fg)}
.simmsg{margin:0;font-size:14px;min-height:2.6em;padding:8px 10px;border-radius:8px;background:var(--bg)}
.simmsg.good{color:var(--ok)} .simmsg.bad{color:var(--bad)} .simmsg.warn{color:var(--warn)}

.res{display:flex;flex-direction:column;gap:6px;font-size:14px;margin:0;padding:0;list-style:none}

.verdict{font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.press{width:100%;padding:16px;font-size:16px}

.ws{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:6px;
  padding:max(6px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

.wsbar .btn{flex:none;padding:7px 11px;font-size:13px}
.wsbar .chip{flex:none}

.wsmsg.good{color:var(--ok)} .wsmsg.bad{color:var(--bad)} .wsmsg.warn{color:var(--warn)}
.rotate-hint{display:none;margin:0;font-size:12px;color:var(--warn);flex:none}
.wsmain{flex:1;min-height:0;display:flex;gap:8px}
.wsboard{flex:1;min-width:0;min-height:0;overflow:auto;border-radius:10px;background:#123524;-webkit-overflow-scrolling:touch}
#wsvg{display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.wsright{flex:0 0 34%;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.wsright .wsside{width:auto;flex:0 1 auto;max-height:58%}
.wsright .wsref[hidden]+.wsside{max-height:none;flex:1}
.wsright .wsside[hidden]{display:none}
.wsref{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;min-height:0}
.wsrefbar{display:flex;gap:4px;flex-wrap:wrap}
.wsrefbar .chip{padding:4px 9px;font-size:12px}
.wsrefimg{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:8px}
.wsrefimg img{display:block;max-width:none}
.refempty{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;color:#333}
.wsside{width:200px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
@media (orientation:portrait){.wsmain{flex-direction:column}.wsright{flex:0 0 52%}.rotate-hint{display:block}}
@media (orientation:landscape) and (max-height:500px){.wsbar .btn{padding:5px 9px;font-size:12px}.wsbar .chip{padding:5px 10px;font-size:12px}.wsmsg{font-size:12px;padding:4px 8px}.ws{gap:4px}}

.patimgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:8px}
.patimgs img{display:block;max-width:none}
.acct{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;min-height:28px}
.acct .chip{padding:4px 10px;font-size:12px}
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}

.plist{display:flex;flex-wrap:wrap;gap:6px}

.badge{font-size:11px;color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:1px 6px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:9px 0;border-radius:7px;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-weight:700;font-size:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:transparent;border-radius:9px;padding:11px 12px;text-align:left}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.exp{font-size:14px;background:var(--bg);border-radius:8px;padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:10px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.steps{display:flex;flex-direction:column;gap:8px}
.step{border:1px dashed var(--line);border-radius:9px;padding:10px 12px;text-align:left;background:transparent;display:flex;gap:10px;align-items:baseline}
.step.picked{border-style:solid;opacity:.45}
.step .n{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:1.5em}
.picked-list{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.picked-list li{display:flex;gap:10px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.picked-list li.ok{color:var(--ok)} .picked-list li.bad{color:var(--bad)}
.picked-list .n{font-family:var(--mono);min-width:1.5em}
.clock{font-family:var(--mono);font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.warn{color:var(--warn)} .clock.over{color:var(--bad)}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.dur{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.dur input{width:64px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:var(--mono)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
.notes{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.notes li{background:var(--bg);border-radius:9px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.notes li p{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.notes small{display:block;color:var(--muted);font-size:12px}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 4px;flex:none}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

    <h1>실기 작업대</h1>
    <p class="sub">자격증을 고르고, 퀴즈·작업 순서·타이머·실수 노트로 연습해.</p>
  </header>
  <div class="certs" id="certs"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="panel" id="panel"></section>
</div>

<script>
const CERTS={
 elec:{name:"전기기능사",color:"--w-brown",tag:"시퀀스 · 배관 작업형",min:330,

  order:["도면·지급 재료 확인","제어판에 기구(차단기·MC·릴레이 등) 배치","배관(전선관)과 박스 고정","전원부·제어선 배선","외부 입선과 단자 결선","회로시험기로 도통 점검 (전원 넣기 전)","마무리 정리 후 제출"],

 elex:{name:"전자기능사",color:"--w-black",tag:"부품 조립 · 납땜 작업형",min:240,

const TABS=[["sim","실습"],["quiz","퀴즈"],["order","순서"],["timer","타이머"],["notes","노트"]];
let AUTH=null; /* {mode:"cloud"|"local", id, nick, owner} */
const PFX=()=>AUTH?"u:"+AUTH.id+":":"guest:";
const raw={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const store={get(k,d){return raw.get(PFX()+k,d)},set(k,v){raw.set(PFX()+k,v);if(k!=="_ts"){raw.set(PFX()+"_ts",Date.now());scheduleSync()}},del(k){raw.del(PFX()+k);raw.set(PFX()+"_ts",Date.now());scheduleSync()}};
let cur="elec", tab="sim";
if(!CERTS[cur])cur="elec";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function renderCerts(){
  $("#certs").innerHTML=Object.entries(CERTS).map(([k,c])=>`<button class="cert" style="--c:var(${c.color})" data-k="${k}" aria-pressed="${k===cur}"><i class="wire"></i><b>${c.name}</b><span>${c.tag}</span></button>`).join("");
  document.querySelectorAll(".cert").forEach(b=>b.onclick=()=>{cur=b.dataset.k;store.set("cur",cur);resetState();render()});
}
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;store.set("tab",tab);render()});
}

/* 퀴즈 */
let Q=null;
function newQuiz(){const c=CERTS[cur];Q={list:shuffle(c.quiz.map((q,i)=>i)),i:0,score:0,answered:false,map:null}}
function quizView(p){
  const c=CERTS[cur]; if(!Q)newQuiz();
  if(Q.i>=Q.list.length){
    p.innerHTML=`<h2>${c.name} 퀴즈 끝</h2><p class="q" style="font-family:var(--mono)">${Q.score} / ${Q.list.length}</p><p class="sub">틀린 문제는 노트에 자동으로 저장돼 있어.</p><div class="row"><button class="btn pri" id="again">다시 풀기 (순서 섞기)</button></div>`;
    $("#again").onclick=()=>{newQuiz();render()};return;
  }
  const q=c.quiz[Q.list[Q.i]];
  if(!Q.map)Q.map=shuffle(q[1].map((_,i)=>i));
  p.innerHTML=`<div class="meta"><span>${Q.i+1} / ${Q.list.length}</span><span>맞힌 문제 ${Q.score}</span></div>
   <p class="q">${esc(q[0])}</p>
   <div class="opts">${Q.map.map((oi,n)=>`<button class="opt" data-oi="${oi}">${"①②③④"[n]} ${esc(q[1][oi])}</button>`).join("")}</div>
   <div id="after"></div>`;
  p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(Q.answered)return;Q.answered=true;
    const oi=+b.dataset.oi, right=oi===q[2];
    p.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.oi===q[2])x.classList.add("ok")});
    if(right)Q.score++;else{b.classList.add("bad");addNote(`[퀴즈 오답] ${q[0]}\n→ 정답: ${q[1][q[2]]}`)}
    $("#after").innerHTML=`<div class="exp"><b>${right?"맞았어!":"아쉽다."}</b> ${esc(q[3])}</div><div class="row" style="margin-top:10px"><button class="btn pri" id="next">다음 문제</button></div>`;
    $("#next").onclick=()=>{Q.i++;Q.answered=false;Q.map=null;render()};
  });
}

/* 작업 순서 */
let O=null;
function newOrder(){const c=CERTS[cur];O={pool:shuffle(c.order.map((_,i)=>i)),picked:[],checked:false}}
function orderView(p){
  const c=CERTS[cur]; if(!O)newOrder();
  const done=O.picked.length===c.order.length;
  p.innerHTML=`<h2>작업 순서 맞추기</h2><p class="sub">시험장에서 하는 순서대로 눌러봐.</p>
   <ol class="picked-list" id="pl">${O.picked.map((i,n)=>`<li class="${O.checked?(i===n?"ok":"bad"):""}"><span class="n">${n+1}</span><span>${esc(c.order[i])}${O.checked&&i!==n?` <small style="display:block">→ ${n+1}번은 '${esc(c.order[n])}'</small>`:""}</span></li>`).join("")}</ol>
   ${done?"":`<div class="steps">${O.pool.map(i=>`<button class="step ${O.picked.includes(i)?"picked":""}" data-i="${i}" ${O.picked.includes(i)?"disabled":""}><span class="n">·</span>${esc(c.order[i])}</button>`).join("")}</div>`}
   <div class="row">${done&&!O.checked?`<button class="btn pri" id="chk">채점</button>`:""}${O.picked.length&&!O.checked?`<button class="btn" id="undo">하나 취소</button>`:""}<button class="btn" id="re">처음부터</button></div>
   ${O.checked?`<div class="exp">${O.picked.every((i,n)=>i===n)?"<b>완벽해!</b> 순서 다 맞았어.":"<b>틀린 곳은 빨간색.</b> 오답은 노트에 저장했어."}</div>`:""}
   <p class="note">${esc(c.note)}</p>`;
  p.querySelectorAll(".step").forEach(b=>b.onclick=()=>{O.picked.push(+b.dataset.i);render()});
  const u=$("#undo");if(u)u.onclick=()=>{O.picked.pop();render()};
  $("#re").onclick=()=>{newOrder();render()};
  const k=$("#chk");if(k)k.onclick=()=>{O.checked=true;
    if(!O.picked.every((i,n)=>i===n))addNote(`[순서 오답] 맞는 순서:\n`+c.order.map((s,n)=>`${n+1}. ${s}`).join("\n"));render()};
}

/* 타이머 */
let T={left:null,run:false,id:null,total:null};
function fmt(s){const neg=s<0;s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(neg?"-":"")+h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function timerView(p){
  const c=CERTS[cur]; const mins=store.get("min_"+cur,c.min);
  if(T.left===null){T.total=mins*60;T.left=T.total}
  const pct=Math.min(100,Math.max(0,(1-T.left/T.total)*100));
  const cls=T.left<0?"over":T.left<=1800?"warn":"";
  p.innerHTML=`<h2>${c.name} 실전 타이머</h2>
   <div class="clock ${cls}" id="clk">${fmt(T.left)}</div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="row"><button class="btn pri" id="go">${T.run?"일시정지":T.left===T.total?"시작":"계속"}</button><button class="btn" id="rs">초기화</button></div>
   <label class="dur" for="mins">시험시간 <input id="mins" type="number" min="10" max="600" step="10" value="${mins}"> 분 <span class="sub">(${Math.floor(mins/60)}시간 ${mins%60}분)</span></label>
   <p class="sub">남은 시간이 30분 이하면 주황색, 시간 초과면 빨간색으로 바뀌어. 연습 끝나면 걸린 시간을 노트에 남겨봐.</p>
   <p class="note">${esc(c.note)}</p>`;
  $("#go").onclick=()=>{T.run=!T.run;if(T.run){T.id=setInterval(()=>{T.left--;const el=$("#clk");if(el&&tab==="timer"){el.textContent=fmt(T.left);el.className="clock "+(T.left<0?"over":T.left<=1800?"warn":"");const b=$(".bar i");if(b)b.style.width=Math.min(100,(1-T.left/T.total)*100)+"%"}},1000)}else clearInterval(T.id);render()};

}

/* ===== 전자 납땜 시뮬레이터 ===== */
const PARTS={
  R:{name:"저항 330Ω",low:true},
  D:{name:"다이오드 1N4001",low:true,polar:true},
  C:{name:"전해 콘덴서 100µF",polar:true},
  LED:{name:"LED (빨강)",polar:true},
  SW:{name:"택트 스위치"}
};
const FP=[
  {id:"J1",fixed:true,pads:[[40,90],[40,425]]},
  {id:"D1",want:"D",pads:[[100,90],[180,90]],lab:[140,62,"middle"]},
  {id:"C1",want:"C",pads:[[180,180],[180,280]],lab:[146,234,"end"]},
  {id:"SW1",want:"SW",pads:[[300,125],[300,185]],lab:[266,160,"end"]},
  {id:"R1",want:"R",pads:[[300,220],[300,290]],lab:[266,260,"end"]},
  {id:"LED1",want:"LED",pads:[[300,330],[300,385]],lab:[266,362,"end"]}
];
const TRACES=[[[40,90],[100,90]],[[180,90],[300,90],[300,125]],[[180,90],[180,180]],[[300,185],[300,220]],[[300,290],[300,330]],[[300,385],[300,425],[40,425]],[[180,280],[180,425]]];
const REV={
  D:"D1 다이오드가 거꾸로 꽂혔어. 다이오드는 한 방향으로만 전류를 흘려서, 회로 전체에 전기가 안 가.",
  C:"C1 전해 콘덴서가 거꾸로 꽂혔어. 실제로는 열나고 부풀거나 터질 수 있어서 바로 전원을 꺼야 해.",
  LED:"LED1이 거꾸로 꽂혔어. LED도 다이오드라서 반대로 꽂으면 불이 안 켜져."
};
const STAGES=[["place","① 꽂기"],["solder","② 납땜"],["cut","③ 리드"],["test","④ 전원"]];
const T_COLD=0.7,T_GOOD=1.6,T_MAX=2.4;
let S=null,FL=null;
function newSim(){S={placed:{},joints:{},cut:{},sel:null,selFlip:false,orderTip:false,stage:"place",result:null,pressing:false,flick:true,schem:false,
  msg:["부품을 고르고, 기판에서 같은 이름이 인쇄된 자리를 눌러 꽂아.",""]}}
const padsOf=f=>f.pads.map((p,i)=>({id:f.id+":"+i,f,x:p[0],y:p[1]}));
const activePads=()=>FP.filter(f=>f.fixed||S.placed[f.id]).flatMap(padsOf);
function say(t,k){S.msg=[t,k||""];const m=$("#msg");if(m){m.textContent=t;m.className="simmsg "+(k||"")}}

function bbox(f){const xs=f.pads.map(p=>p[0]),ys=f.pads.map(p=>p[1]),v=xs[0]===xs[1],ax=v?24:12,ay=v?12:24;
  return{x:Math.min(...xs)-ax,y:Math.min(...ys)-ay,w:Math.max(...xs)-Math.min(...xs)+2*ax,h:Math.max(...ys)-Math.min(...ys)+2*ay}}

function partSVG(f,pl,glow){
  const[a,b]=f.pads,cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,vert=a[0]===b[0],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const s=pl.flip?1:-1; /* +쪽(애노드) 로컬 x 부호 */
  let g=`<line x1="${-len/2}" y1="0" x2="${len/2}" y2="0" stroke="#b9bec2" stroke-width="2.2"/>`;
  if(pl.part==="R"){const L=len-30;g+=`<rect x="${-L/2}" y="-7" width="${L}" height="14" rx="6" fill="#d8bf8c"/>`;
    [["#e67e22",-L/2+9],["#e67e22",-L/2+16],["#7b4a1e",-L/2+23],["#c9a23a",L/2-10]].forEach(([c,x])=>g+=`<rect x="${x}" y="-7" width="4" height="14" fill="${c}"/>`)}
  if(pl.part==="D"){const L=len-44;g+=`<rect x="${-L/2}" y="-6.5" width="${L}" height="13" rx="2" fill="#222"/><rect x="${-s>0?L/2-9:-L/2+5}" y="-6.5" width="4" height="13" fill="#c8ccd0"/>`}
  if(pl.part==="C"){const id="cc"+f.id;g+=`<clipPath id="${id}"><circle r="27"/></clipPath><circle r="27" fill="#24508f"/>
    <rect x="${-s>0?9:-27}" y="-27" width="18" height="54" fill="#b9c7de" clip-path="url(#${id})"/>
    <text x="${-s>0?18:-18}" y="5" font-size="14" font-weight="700" text-anchor="middle" fill="#24508f" transform="rotate(${vert?-90:0} ${-s>0?18:-18} 0)">−</text>
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#9fb3d6" stroke-width="1.5"/>`}
  if(pl.part==="LED"){if(glow)g+=`<circle r="34" fill="#ff4d4d" opacity=".85" filter="url(#glow)"/>`;
    g+=`<circle r="17" fill="${glow?"#ff7b7b":"#b71c1c"}" stroke="${glow?"#ffd0d0":"#e57373"}" stroke-width="2"/>
    <rect x="${-s>0?13:-19}" y="-19" width="6" height="38" fill="#1d5a3a"/><circle r="6" fill="${glow?"#fff3f3":"#d84343"}" opacity=".7"/>`}
  if(pl.part==="SW"){g+=`<rect x="-18" y="-18" width="36" height="36" rx="4" fill="#2b2b2b"/><circle r="10" fill="${S.pressing&&S.stage==="test"?"#4a4a4a":"#7d7d7d"}"/>`}
  return `<g transform="translate(${cx} ${cy}) rotate(${vert?90:0})">${g}</g>`;
}

function jointSVG(p){
  const st=S.joints[p.id];let h="";
  if(st==="good")h+=`<circle cx="${p.x}" cy="${p.y}" r="8.5" fill="url(#sol)"/><circle cx="${p.x-2.5}" cy="${p.y-2.5}" r="2" fill="#fff" opacity=".9"/>`;
  if(st==="cold")h+=`<path d="M${p.x-9} ${p.y-2} l3 -6 l5 1 l4 -3 l5 4 l1 6 l-3 5 l-6 2 l-6 -1 l-3 -4z" fill="#8b918d" stroke="#5f6561" stroke-width="1"/>`;
  if(st==="over")h+=`<circle cx="${p.x}" cy="${p.y}" r="14" fill="url(#sol)"/><circle cx="${p.x-4}" cy="${p.y-4}" r="2.5" fill="#fff" opacity=".8"/>`;
  if(!p.f.fixed&&!S.cut[p.id])h+=`<line x1="${p.x}" y1="${p.y}" x2="${p.x+9}" y2="${p.y-12}" stroke="#d3d8dc" stroke-width="2.4" stroke-linecap="round"/>`;
  return h;
}

function drawBoard(){
  const r=S.result,glow=r&&r.works&&S.pressing&&(!r.flicker||S.flick);
  let h=`<defs><radialGradient id="sol" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9dde0"/><stop offset="1" stop-color="#8d959b"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <rect x="4" y="4" width="352" height="452" rx="14" fill="#1d5a3a"/>`;
  TRACES.forEach(t=>h+=`<polyline points="${t.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#2c7a50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`);
  /* 실크 인쇄 */
  h+=`<g fill="#e6efe8" font-family="JetBrains Mono,monospace" font-size="13" font-weight="700">
    <rect x="22" y="72" width="36" height="36" rx="4" fill="#4b545b"/><rect x="22" y="407" width="36" height="36" rx="4" fill="#4b545b"/>
    <text x="40" y="60" text-anchor="middle">+5V</text><text x="40" y="453" text-anchor="middle">GND</text><text x="72" y="256" font-size="11" opacity=".75">J1 전원 단자</text>`;
  FP.filter(f=>!f.fixed).forEach(f=>{const b=bbox(f);
    h+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="none" stroke="#e6efe8" stroke-width="1.2" stroke-dasharray="5 4" opacity=".8"/>
    <text x="${f.lab[0]}" y="${f.lab[1]}" text-anchor="${f.lab[2]}">${f.id}</text>`});
  h+=`<rect x="152" y="80" width="4" height="20"/>
    <text x="202" y="172" font-size="16">+</text><text x="318" y="328" font-size="16">+</text></g>`;
  /* 패드 */
  FP.flatMap(padsOf).forEach(p=>h+=`<circle cx="${p.x}" cy="${p.y}" r="9" fill="#c98b3a"/><circle cx="${p.x}" cy="${p.y}" r="3" fill="#0e2a1b"/>`);
  /* 부품 */
  FP.filter(f=>S.placed[f.id]).forEach(f=>h+=partSVG(f,S.placed[f.id],f.id==="LED1"&&glow));
  /* 납땜 */
  activePads().forEach(p=>h+=jointSVG(p));
  h+=`<g id="heatg" visibility="hidden"><circle r="18" fill="none" stroke="#ffb74d" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 120" id="heatc"/></g>`;
  /* 터치 영역 */
  if(S.stage==="place")FP.filter(f=>!f.fixed).forEach(f=>{const b=bbox(f);h+=`<rect data-fp="${f.id}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent"/>`});
  if(S.stage==="solder"||S.stage==="cut")FP.flatMap(padsOf).forEach(p=>h+=`<circle data-pad="${p.id}" cx="${p.x}" cy="${p.y}" r="16" fill="transparent"/>`);
  if(S.stage==="test"&&S.placed.SW1){const b=bbox(FP[3]);h+=`<rect data-sw="1" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent"/>`}
  $("#board").innerHTML=h;
}

function counts(){
  const placed=FP.filter(f=>!f.fixed&&S.placed[f.id]).length;
  const ap=activePads(),sold=ap.filter(p=>S.joints[p.id]).length;
  const lp=ap.filter(p=>!p.f.fixed),cut=lp.filter(p=>S.cut[p.id]).length;
  return{place:`${placed}/5`,solder:`${sold}/${ap.length}`,cut:`${cut}/${lp.length}`,test:S.result?(S.result.works?"OK":"NG"):"-"};
}

function drawCtrl(){
  const c=counts();
  $("#stages").innerHTML=STAGES.map(([k,l])=>`<button class="stg" data-st="${k}" aria-pressed="${S.stage===k}">${l}<small>${c[k]}</small></button>`).join("");
  document.querySelectorAll(".stg").forEach(b=>b.onclick=()=>{S.stage=b.dataset.st;S.pressing=false;
    if(S.stage==="test")S.result=null;
    say({place:"부품을 고르고, 같은 이름이 인쇄된 자리를 눌러 꽂아.",solder:"패드를 꾹 누르고 있다가 초록 구간에서 손을 떼. 인두로 패드와 리드를 같이 데우는 느낌이야.",cut:"납땜한 곳을 눌러서 남은 리드선을 잘라.",test:"전원을 넣기 전에 빠진 곳이 없는지 한 번 더 봐."}[S.stage]);
    drawBoard();drawCtrl()});
  const k=$("#ctrl");let h="";
  if(S.stage==="place"){
    const left=Object.keys(PARTS).filter(p=>!Object.values(S.placed).some(x=>x.part===p));
    h+=left.length?`<div class="tray">${left.map(p=>`<button class="chip" data-p="${p}" aria-pressed="${S.sel===p}">${PARTS[p].name}</button>`).join("")}</div>`:`<p class="sub">부품을 다 꽂았어. ② 납땜으로 넘어가.</p>`;
    if(S.sel&&PARTS[S.sel].polar)h+=`<div class="row"><button class="btn" id="flip">방향 뒤집기</button><span class="sub" style="align-self:center">지금: ${S.selFlip?"<b>뒤집힌 방향</b>":"기본 방향"}</span></div>`;
    h+=`<p class="sub">꽂힌 부품을 누르면 다시 빠져. 극성 있는 부품은 실크 인쇄의 +, 띠 표시를 잘 봐.</p>`;
  }
  if(S.stage==="solder")h+=`<div class="gauge"><span class="z c"></span><span class="z g"></span><span class="z o"></span><i id="gfill"></i></div><div class="glab"><span>냉납</span><span>양호</span><span>납 과다</span></div>
    <p class="sub">이미 납땜한 곳을 다시 누르면 고쳐 할 수 있어. 실제로는 납 흡입기로 납을 빼고 다시 해.</p>`;
  if(S.stage==="cut")h+=`<p class="sub">리드는 납땜 위쪽 1~2mm 정도 남기고 잘라. 너무 바짝 자르면 납땜에 금이 갈 수 있어.</p>`;
  if(S.stage==="test"){
    if(!S.result)h+=`<button class="btn pri press" id="pw">전원 넣기 (DC 5V)</button>`;
    else{const r=S.result;
      h+=`<p class="verdict ${r.works?"ok":"no"}">${r.works?(r.flicker?"동작은 하는데 불안정해":"동작 OK!"):"동작 안 함"}</p>`;
      if(r.works)h+=`<button class="btn pri press" id="sw">SW1 누르고 있기</button>`;
      if(r.fatal.length||r.warn.length)h+=`<ul class="res">${r.fatal.map(t=>`<li class="f">${esc(t)}</li>`).join("")}${r.warn.map(t=>`<li class="w">${esc(t)}</li>`).join("")}</ul>`;
      else h+=`<p class="sub">감점 요소 없음. 깔끔해!</p>`;
      h+=`<div class="row"><button class="btn" id="off">전원 끄기</button></div>`;
    }
  }
  k.innerHTML=h;
  k.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.sel=S.sel===b.dataset.p?null:b.dataset.p;S.selFlip=false;
    if(S.sel)say(`${PARTS[S.sel].name} 들었어. 꽂을 자리를 눌러.`);drawCtrl()});
  const fl=$("#flip");if(fl)fl.onclick=()=>{S.selFlip=!S.selFlip;drawCtrl()};
  const pw=$("#pw");if(pw)pw.onclick=()=>{S.result=evaluate();logFails();drawBoard();drawCtrl();
    say(S.result.works?"전원 들어갔어. SW1을 누르고 있으면 LED가 켜져야 해.":"문제가 있어. 아래 목록을 보고 고쳐봐.",S.result.works?"good":"bad")};
  const off=$("#off");if(off)off.onclick=()=>{S.result=null;S.pressing=false;drawBoard();drawCtrl();say("전원 껐어. 고칠 단계로 돌아가서 수정해.")};
  const sw=$("#sw");if(sw){const dn=e=>{e.preventDefault();press(true)},up=()=>press(false);
    sw.addEventListener("pointerdown",dn);["pointerup","pointerleave","pointercancel"].forEach(ev=>sw.addEventListener(ev,up))}
}

function press(on){
  if(S.pressing===on)return;S.pressing=on;clearInterval(FL);
  if(on&&S.result&&S.result.flicker)FL=setInterval(()=>{S.flick=Math.random()>.45;drawBoard()},110);
  S.flick=true;drawBoard();
}

function evaluate(){
  const fatal=[],warn=[];
  FP.filter(f=>!f.fixed).forEach(f=>{const pl=S.placed[f.id];
    if(!pl){fatal.push(`${f.id} 자리가 비어 있어.`);return}
    if(pl.part!==f.want){fatal.push(`${f.id} 자리에 ${PARTS[pl.part].name}이(가) 꽂혔어. 여기는 ${PARTS[f.want].name} 자리야.`);return}
    if(PARTS[pl.part].polar&&pl.flip)fatal.push(REV[pl.part]);
  });
  const ap=activePads(),none=ap.filter(p=>!S.joints[p.id]),cold=ap.filter(p=>S.joints[p.id]==="cold"),over=ap.filter(p=>S.joints[p.id]==="over"),uncut=ap.filter(p=>!p.f.fixed&&!S.cut[p.id]);
  const names=a=>[...new Set(a.map(p=>p.f.id))].join(", ");
  if(none.length)fatal.push(`납땜 안 한 곳 ${none.length}개 (${names(none)}). 그 부분은 전기가 안 통해.`);
  if(cold.length)warn.push(`냉납 ${cold.length}개 (${names(cold)}). 접촉이 불안정해서 LED가 깜빡이거나 꺼질 수 있어.`);
  if(over.length)warn.push(`납 과다 ${over.length}개 (${names(over)}). 옆 패턴이랑 붙으면(브릿지) 단락 위험이 있어.`);
  if(uncut.length)warn.push(`리드 안 자른 곳 ${uncut.length}개. 긴 리드끼리 닿으면 단락될 수 있고 감점 요소야.`);
  if(S.orderTip)warn.push("키 큰 부품을 먼저 꽂았어. 낮은 부품(저항·다이오드)부터 꽂아야 기판을 뒤집어 납땜할 때 부품이 안 빠져.");
  return{fatal,warn,works:!fatal.length,flicker:cold.some(p=>p.f.id!=="C1")};
}
function logFails(){const r=S.result;if(!r||(!r.fatal.length&&!r.warn.length))return;
  addNote("[납땜 실습] "+(r.works?"동작은 했지만":"동작 안 함")+"\n- "+[...r.fatal,...r.warn].join("\n- "))}

function onBoard(e){
  const t=e.target;
  if(S.stage==="place"&&t.dataset.fp){const id=t.dataset.fp;
    if(S.placed[id]){const pl=S.placed[id];delete S.placed[id];padsOf(FP.find(f=>f.id===id)).forEach(p=>{delete S.joints[p.id];delete S.cut[p.id]});
      S.sel=pl.part;S.selFlip=pl.flip;say(`${id}에서 ${PARTS[pl.part].name}을(를) 뺐어. 다시 꽂을 자리를 눌러.`)}
    else if(S.sel){S.placed[id]={part:S.sel,flip:S.selFlip};
      if(!PARTS[S.sel].low&&Object.keys(PARTS).some(p=>PARTS[p].low&&!Object.values(S.placed).some(x=>x.part===p)))S.orderTip=true;
      say(`${id} 자리에 ${PARTS[S.sel].name} 꽂았어.`);S.sel=null;S.selFlip=false}
    else say("먼저 아래에서 부품을 골라.","warn");
    drawBoard();drawCtrl();return}
  if(S.stage==="solder"&&t.dataset.pad){
    const p=activePads().find(x=>x.id===t.dataset.pad);if(!p){say("여긴 아직 부품이 없어. 부품부터 꽂아.","warn");return}
    e.preventDefault();try{t.releasePointerCapture&&t.releasePointerCapture(e.pointerId)}catch(_){}
    startHeat(p);return}
  if(S.stage==="cut"&&t.dataset.pad){
    const p=activePads().find(x=>x.id===t.dataset.pad);
    if(!p||p.f.fixed){say("단자대는 리드가 없어.","warn");return}
    if(!S.joints[p.id]){say("납땜부터 하고 잘라야 해. 먼저 자르면 부품이 빠질 수 있어.","warn");return}
    S.cut[p.id]=true;say(`${p.f.id} 리드 잘랐어.`);drawBoard();drawCtrl();return}

    const c=$("#heatc");if(c){c.setAttribute("stroke-dasharray",`${f*113} 120`);c.setAttribute("stroke",s<T_COLD?"#9aa29e":s<=T_GOOD?"#6fcf8f":"#ef7b6e")}

    if(s>=T_MAX)endHeat();else requestAnimationFrame(tick)};

  if(!H)return;const s=(performance.now()-H.t0)/1000,p=H.p,redo=H.redo;H=null;
  const st=s<T_COLD?"cold":s<=T_GOOD?"good":"over";S.joints[p.id]=st;S.cut[p.id]=false;

/* 핀 위치: 앞면 기준 (x=열 인덱스 0..61 → 물리 열 번호 c=x+1), 회전 rot 0..3 */
function baseOff(P){
  if(P.kind==="ic"||P.kind==="fnd"){const h=P.n/2,o=[];for(let k=1;k<=P.n;k++)o.push(k<=h?[k-1,P.gap]:[P.n-k,0]);return o}
  if(P.kind==="sw")return[[0,0],[1,0],[2,0]];
  return[[0,0],[P.span,0]];
}
function rotOff(o,rot){for(let r=0;r<rot;r++)o=o.map(([x,y])=>[-y,x]);const mx=Math.min(...o.map(p=>p[0])),my=Math.min(...o.map(p=>p[1]));return o.map(([x,y])=>[x-mx,y-my])}
function pinsOf(key,pl){const o=rotOff(baseOff(K1P[key]),pl.rot);return o.map(([x,y])=>[pl.a[0]+x,pl.a[1]+y])} /* [c, j] */
function fits(key,a,rot,skip){
  const o=rotOff(baseOff(K1P[key]),rot).map(([x,y])=>[a[0]+x,a[1]+y]);
  if(o.some(([c,j])=>c<1||c>GC||j<1||j>GR-2))return"기판 밖으로 나가. 다른 위치를 골라.";
  const used=new Set();Object.entries(K.parts).forEach(([k,pl])=>{if(k===skip)return;pinsOf(k,pl).forEach(([c,j])=>used.add(hid(c,j)))});
  if(o.some(([c,j])=>used.has(hid(c,j))))return"다른 부품 다리랑 같은 구멍이야.";
  return"";
}

function segSVG(x,y,w,h,on,col,op,th){
  const S=(k,d)=>`<path d="${d}" fill="${on.includes(k)?col:"rgba(140,40,40,.3)"}" opacity="${on.includes(k)?op:1}"/>`;
  const r=(x1,y1,ww,hh)=>`M${x1} ${y1}h${ww}v${hh}h${-ww}z`,m=y+h/2;
  return S("a",r(x+th,y,w-2*th,th))+S("d",r(x+th,y+h-th,w-2*th,th))+S("g",r(x+th,m-th/2,w-2*th,th))+S("f",r(x,y+th,th,h/2-th))+S("b",r(x+w-th,y+th,th,h/2-th))+S("e",r(x,m,th,h/2-th))+S("c",r(x+w-th,m,th,h/2-th))
   +`<circle cx="${x+w+th*1.3}" cy="${y+h-th/2}" r="${th*0.6}" fill="${on.includes("dp")?col:"rgba(140,40,40,.3)"}" opacity="${on.includes("dp")?op:1}"/>`;

function partBox(key,pl){const ps=pinsOf(key,pl).map(([c,j])=>[M+vx(c),M+j]);const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);

    const nx=along?(dx<0?x0:x1):mx,ny=along?my:(dy<0?y0:y1);
    g+=`<circle cx="${nx}" cy="${ny}" r="0.32" fill="#3f3f3f"/><circle cx="${p1[0]+(cx-p1[0])*0.28}" cy="${p1[1]+(cy-p1[1])*0.28}" r="0.13" fill="#5a5a5a"/>
      <text x="${cx}" y="${cy+0.22}" font-size="0.62" text-anchor="middle" fill="#e6e6e6" font-family="JetBrains Mono,monospace" transform="rotate(${along?0:90} ${cx} ${cy})">${P.name}</text>`}
  if(P.kind==="fnd"){const x0=b.x0-0.45,x1=b.x1+0.45,y0=b.y0-0.45,y1=b.y1+0.45;
    g+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="0.15" fill="#2c2c2c"/>`;

    g+=`<g transform="rotate(${pl.rot*90} ${cx} ${cy})">${segSVG(cx-dw/2-0.15,cy-dh/2,dw,dh,disp?disp.on:[],"#ff3b3b",disp?disp.op:1,dw*0.17)}</g>`}
  if(P.kind==="r"||P.kind==="c"){const[a,c2]=ps,len=Math.hypot(c2[0]-a[0],c2[1]-a[1]),ang=Math.atan2(c2[1]-a[1],c2[0]-a[0])*180/Math.PI;
    let q=`<line x1="${-len/2}" y1="0" x2="${len/2}" y2="0" stroke="#c4c9cd" stroke-width="0.12"/>`;

    if(P.kind==="c"&&!P.polar)q+=`<ellipse rx="0.55" ry="0.45" fill="#d9822b"/>`;

    g+=`<text x="${ps[0][0]}" y="${ps[0][1]+(along?1.1:0)-(along?0:0.8)}" font-size="0.45" text-anchor="middle" fill="#e6efe8">UP</text>`}

function partBack(key,pl){

  b.ps.forEach(([x,y],i)=>{const pin=i+1;if(key==="ic4510"&&K.cuts.includes(pin))return;
    const first=(P.kind==="ic"||P.kind==="fnd")&&pin===1;

function fitK(){const b=$("#wsboard");if(!b)return;const H=GR+M+0.8;K.zoom=Math.max(6,(b.clientHeight-2)/H)}

function sizeSVG(){const sv=$("#wsvg");if(!sv)return;const W=GC+M+0.8,H=GR+M+0.8;sv.style.width=(W*K.zoom)+"px";sv.style.height=(H*K.zoom)+"px"}

  },{capture:true});

  const busy=on=>{btn.disabled=on;btn.textContent=on?"잠시만...":btn.textContent};
